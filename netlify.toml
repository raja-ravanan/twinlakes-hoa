[functions]
  directory = "netlify/functions"

# The publish directory is the repo root, so every committed .md file is
# served as a static asset — https://twinlakes.netlify.app/docs/resident-portal-setup.md
# returns 200 today. These are internal engineering documents (auth design,
# architecture review, working notes), not site content, and nothing on the
# site links to them. Keep them in git, out of the public site.
[[redirects]]
  from = "/docs/*"
  status = 404
  to = "/404.html"
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  status = 404
  to = "/404.html"
  force = true

[[redirects]]
  from = "/HANDOVER.md"
  status = 404
  to = "/404.html"
  force = true

[[redirects]]
  from = "/FABLE-DESIGN-BRIEF.md"
  status = 404
  to = "/404.html"
  force = true

[functions.scan-inbox]
  timeout = 300

[functions.board-api]
  timeout = 30

[functions.email-digest]
  timeout = 300

[functions.health-check]
  timeout = 30
  schedule = "0 */3 * * *"